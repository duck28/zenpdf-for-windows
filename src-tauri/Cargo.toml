[package]
name = "zenpdf"
version = "1.0.0"
description = "ZenPDF for Windows: read, annotate and cite PDFs"
authors = ["Roland Matuz"]
edition = "2024"

[lib]
name = "zenpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.23"
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
