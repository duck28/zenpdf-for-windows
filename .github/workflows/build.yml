# Builds and tests ZenPDF for Windows on every push to main and on pull requests, and
# builds the installers for release.yml. It doesn't publish anything itself.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Rust side embeds the built interface, so build it before Rust compiles.
      - run: npm run build

      - name: Unit tests
        run: cargo test
        working-directory: src-tauri

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: ZenPDF-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
