# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem, and dependabot-automerge.yml merges them once the build passes; major updates get
# their own pull requests and wait for review. The 7-day cooldown waits a week after a release
# before proposing it, so a compromised or broken release is usually caught and yanked first; it
# does not delay security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
